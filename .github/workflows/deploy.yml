name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Адрес сайта на GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_FORMSPREE_ENDPOINT: ${{ vars.VITE_FORMSPREE_ENDPOINT }}

      # GitHub Pages не умеет перенаправлять все адреса на index.html,
      # поэтому страница /privacy получает собственную копию разметки.
      - name: Страница политики и запасная страница
        run: |
          mkdir -p dist/privacy
          cp dist/index.html dist/privacy/index.html
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
